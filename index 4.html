<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>NovaSwap — Crypto Exchange</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif}
a{text-decoration:none;color:inherit}button,input,select{font:inherit}.nav{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #20252c;position:sticky;top:0;background:#0b0d10f2;backdrop-filter:blur(16px);z-index:5}.brand{font-weight:800;display:flex;align-items:center;gap:9px}.logo{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#c9ff42;color:#0b0d10;font-weight:900}.navlinks{display:flex;gap:18px;color:#969eaa;font-size:13px}.navlinks a.active,.navlinks a:hover{color:#fff}.login{border:1px solid #2a3038;background:#12161b;color:#fff;border-radius:10px;padding:9px 13px}
main{min-height:100vh}.hero{max-width:1000px;margin:auto;padding:55px 20px 45px;display:grid;grid-template-columns:1fr 390px;gap:55px;align-items:center}.pill{display:inline-block;color:#c9ff42;border:1px solid #354327;background:#151b12;padding:6px 10px;border-radius:99px;font-size:10px;font-weight:800;letter-spacing:.08em}.hero h1{font-size:58px;line-height:.98;letter-spacing:-3px;margin:17px 0}.hero h1 span{color:#747c88}.hero p{color:#929aa5;line-height:1.55;max-width:540px}.primary{display:inline-flex;align-items:center;justify-content:center;background:#c9ff42;color:#0b0d10;border:0;border-radius:11px;padding:13px 18px;font-weight:800;cursor:pointer}.card{background:#12161b;border:1px solid #272d35;border-radius:18px;box-shadow:0 20px 70px #0007}.exchange{padding:23px}.title{display:flex;justify-content:space-between;margin-bottom:25px}.muted{color:#858e9a;font-size:12px}.label{color:#858e9a;font-size:12px}.amount{display:flex;background:#0c0f13;border:1px solid #292f37;border-radius:12px;margin:7px 0 15px}.amount input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;padding:14px;font-size:22px}.amount select{border:0;border-left:1px solid #292f37;background:#181d23;color:#fff;border-radius:0 12px 12px 0;padding:0 10px;font-weight:700}.swap{display:block;margin:0 auto 9px;width:34px;height:34px;border-radius:50%;border:1px solid #30363e;background:#171b20;color:#c9ff42}.wide{width:100%;margin-top:7px}.exchange small{display:block;text-align:center;color:#69727d;font-size:10px;margin-top:11px}.features{max-width:1000px;margin:auto;padding:0 20px 70px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.feature{padding:20px;border:1px solid #252b32;border-radius:15px;background:#101318}.feature b{font-size:14px}.feature p{color:#818a96;font-size:12px;line-height:1.5;margin-bottom:0}.page{max-width:850px;margin:auto;padding:45px 20px 80px}.page h2{font-size:40px;letter-spacing:-1.5px;margin:12px 0 4px}.pagehead{margin-bottom:25px}.form{max-width:630px;margin:auto;padding:25px}.summary{border-top:1px solid #292f37;border-bottom:1px solid #292f37;padding:15px 0;margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:9px;font-size:12px}.summary b{text-align:right}.notice{display:flex;justify-content:center;color:#707985;font-size:11px;margin-top:15px}.orders{overflow:hidden}.order{display:grid;grid-template-columns:1.4fr 1fr auto;gap:15px;align-items:center;padding:18px 20px;border-bottom:1px solid #272d35}.order:last-child{border:0}.order small{display:block;color:#747d88;margin-top:5px}.status{padding:7px 9px;border-radius:8px;background:#242a32;color:#c4cbd3;font-size:10px}.done{color:#c9ff42;background:#182216}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:18px}.stat{padding:20px}.stat small{color:#77808c}.stat strong{display:block;font-size:27px;margin:8px 0}.stat span{color:#c9ff42;font-size:11px}.bottom{display:none}
@media(max-width:700px){.nav{padding:0 14px}.navlinks{display:none}.hero{grid-template-columns:1fr;padding-top:38px;gap:30px}.hero h1{font-size:48px}.features{grid-template-columns:1fr}.features .feature{display:flex;gap:12px}.page h2{font-size:34px}.order{grid-template-columns:1fr auto}.order>div:nth-child(2){display:none}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;height:68px;background:#11151aee;border-top:1px solid #282e35;backdrop-filter:blur(18px);z-index:9;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom)}.bottom a{color:#7f8792;font-size:10px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px}.bottom a.active{color:#c9ff42}.bottom span{font-size:19px}.page{padding-bottom:100px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const rates={EUR:1,USD:.92,USDT:.99,BTC:103500,ETH:3950};
let page="home",from="EUR",to="USDT",amount="1000";
function nav(){return `<header class="nav"><a class="brand" href="#home"><span class="logo">N</span> NovaSwap</a><nav class="navlinks"><a class="${page==='exchange'?'active':''}" href="#exchange">Обмен</a><a class="${page==='orders'?'active':''}" href="#orders">Мои заказы</a><a class="${page==='admin'?'active':''}" href="#admin">Админ</a></nav><button class="login" onclick="demoLogin()">Войти</button></header>`}
function bottom(){return `<nav class="bottom"><a class="${page==='home'?'active':''}" href="#home"><span>⌂</span>Главная</a><a class="${page==='exchange'?'active':''}" href="#exchange"><span>⇄</span>Обмен</a><a class="${page==='orders'?'active':''}" href="#orders"><span>☷</span>Заказы</a></nav>`}
function amountOut(){let n=parseFloat(amount)||0;let base=n*rates[from];return to==="BTC"?(base/rates.BTC).toFixed(6):to==="ETH"?(base/rates.ETH).toFixed(5):(base*rates[to]).toFixed(2)}
function home(){return `<section class="hero"><div><span class="pill">● БЫСТРЫЙ ОБМЕН</span><h1>Криптообмен<br><span>без лишнего.</span></h1><p>Современный мобильный интерфейс для обмена цифровых активов. Демонстрационный режим — без реальных платежей.</p><a class="primary" href="#exchange">Начать обмен&nbsp; →</a></div><div class="card exchange"><div class="title"><b>Обменять</b><span class="muted">Демо</span></div>${form(false)}</div></section><section class="features"><div class="feature"><b>⚡ Быстро</b><p>Создание заявки за несколько секунд.</p></div><div class="feature"><b>◈ Безопасно</b><p>Подготовлено для дальнейшего KYC/AML.</p></div><div class="feature"><b>✓ Прозрачно</b><p>Статус каждой заявки в личном кабинете.</p></div></section>`}
function form(full){let assets=["EUR","USD","USDT","BTC","ETH"];return `<label class="label">Вы отдаёте</label><div class="amount"><input id="amt" value="${amount}" inputmode="decimal" oninput="amount=this.value;refresh()"><select onchange="from=this.value;refresh()">${assets.map(x=>`<option ${x===from?'selected':''}>${x}</option>`).join("")}</select></div><button class="swap" onclick="let x=from;from=to;to=x;refresh()">↕</button><label class="label">Вы получаете</label><div class="amount"><input value="${amountOut()}" readonly><select onchange="to=this.value;refresh()">${assets.filter(x=>x!==from).map(x=>`<option ${x===to?'selected':''}>${x}</option>`).join("")}</select></div>${full?`<div class="summary"><span class="muted">Курс</span><b>1 ${from} ≈ ${(+amountOut()/(+amount||1)).toFixed(6)} ${to}</b><span class="muted">Комиссия</span><b>0.00% <span style="color:#c9ff42">демо</span></b></div>`:""}<button class="primary wide" onclick="createOrder()">Создать заявку</button>${full?`<div class="notice">🔒 Реальные платежи отключены</div>`:`<small>Тестовый режим · реальные средства не принимаются</small>`}`}
function exchange(){return `<section class="page"><div class="pagehead"><span class="pill">ДЕМО-РЕЖИМ</span><h2>Создать заявку</h2><p class="muted">Выберите направление и сумму обмена.</p></div><div class="card form">${form(true)}</div></section>`}
function orders(){return `<section class="page"><div class="pagehead"><span class="pill">ЛИЧНЫЙ КАБИНЕТ</span><h2>Мои заказы</h2><p class="muted">История заявок на обмен.</p></div><div class="card orders">${[['#NS-1048','EUR → USDT','1 000 EUR','1 000 USDT','Выполнено','done'],['#NS-1047','BTC → USDT','0.015 BTC','1 552.50 USDT','Проверка',''],['#NS-1046','USDT → EUR','500 USDT','495 EUR','Ожидает оплаты','']].map(o=>`<div class="order"><div><b>${o[0]}</b><small>${o[1]}</small></div><div><b>${o[2]}</b><small>→ ${o[3]}</small></div><span class="status ${o[5]}">${o[4]}</span></div>`).join("")}</div></section>`}
function admin(){return `<section class="page"><span class="pill">ADMIN</span><h2>Панель управления</h2><p class="muted">Демо-данные MVP.</p><div class="stats"><div class="card stat"><small>Заявок сегодня</small><strong>24</strong><span>+12%</span></div><div class="card stat"><small>Оборот</small><strong>€18 420</strong><span>+8.4%</span></div><div class="card stat"><small>На проверке</small><strong>3</strong><span>требуют внимания</span></div></div><div class="card orders">${['NS-1048 · EUR → USDT','NS-1047 · BTC → USDT','NS-1046 · USDT → EUR'].map((x,i)=>`<div class="order"><div><b>${x}</b><small>Сегодня</small></div><div><b>${['€1,000','0.015 BTC','500 USDT'][i]}</b></div><span class="status ${i===0?'done':''}">${i===0?'Выполнено':'Проверка'}</span></div>`).join("")}</div></section>`}
function createOrder(){alert("Заявка создана в ДЕМО-режиме. Реальные средства не принимаются.");location.hash="orders"}
function demoLogin(){alert("Авторизация будет подключена на следующем этапе.");}
function refresh(){document.getElementById("app").innerHTML=nav()+({home,exchange,orders,admin}[page]())+bottom()}
function route(){let h=location.hash.replace("#","")||"home";page=["home","exchange","orders","admin"].includes(h)?h:"home";refresh()}
window.addEventListener("hashchange",route);route();
</script>
</body>
</html>
